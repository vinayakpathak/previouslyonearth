# Every book read for this book, in the order read, with notes on each.
#
# All of them are listed at the back of the book under "Bookshelf", cited or
# not. Cite one in a chapter with its key: @bridges, or with a location,
# @bridges[p. 12]. Citations become footnotes.
#
# The book's details (type, title, author, translator, date) are in
# Hayagriva's format:
# https://github.com/typst/hayagriva/blob/main/docs/file-format.md
#
# Three more fields are for choosing what to read next. They never appear in
# the book.
#
#   topics       places (countries, then regions), periods (centuries or
#                named eras) and themes, e.g. [Germany, 19th century,
#                industrial revolution]. Reuse a topic already used here
#                before making a new one.
#   form         the kind of book: travel memoir, memoir, narrative
#                journalism, narrative history, biography, academic history
#                and so on
#   read:        what you made of the book
#     when         month you finished or stopped, e.g. 2026-10
#     status       finished, reading or abandoned
#     difficulty   too easy, easy, moderate, hard or too hard
#     engagement   gripping, good, okay or slog
#     learned      what it taught you that you didn't know
#     questions    what it left you curious about
#     thoughts     anything else
#
# Only status, difficulty and engagement are needed.

guerriero:
  type: book
  title: "A Simple Story: The Last Malambo"
  author: Guerriero, Leila
  affiliated:
    - role: translator
      names: Riddle, Frances
  date: 2017
  topics: [Argentina, Córdoba, malambo, folk dance, 21st century]
  form: narrative journalism
  read:
    when: 2026
    status: finished
    difficulty: easy
    engagement: gripping
    learned: |
      A cultural aspect of Argentina: malambo, the dance the book is about.
    thoughts: |
      I quite enjoyed the book. It was short and it followed a small number
      of real-life people. And it taught me about a cultural aspect of
      Argentina. It was great to set the setting. The people's lives were
      interesting. They were relatable even though they were about a
      specific dance. But there was passion. And there was drama. There was
      suspense about whether the main character was going to win or not.
      And the author did an excellent job at getting to know the people she
      wrote about. Overall an excellent reading experience.

france:
  type: book
  title: Bad Times in Buenos Aires
  author: France, Miranda
  date: 1998
  topics: [Argentina, Buenos Aires, Dirty War, 20th century]
  form: travel memoir
  read:
    when: 2026
    status: finished
    difficulty: moderate
    engagement: gripping
    learned: |
      Quite a bit, including some main events in Argentinian history in the
      20th century.
    questions: |
      Eva Perón, whom it mentioned a few times.
    thoughts: |
      I really loved this book. In general I enjoy books written in the
      style of a travel memoir, but with history lessons interspersed. The
      author went to Buenos Aires and lived there for a while and explored
      the city and the life and wrote about it in the book. But it wasn't
      only her description of the travel. She would also teach about the
      history of Argentina every now and then. I got to learn quite a bit.
      It was a good deeper book after the first book's intro.

hedges:
  type: book
  title: "Evita: The Life of Eva Perón"
  author: Hedges, Jill
  date: 2017
  topics: [Argentina, Eva Perón, Peronism, 20th century]
  form: academic biography
  read:
    when: 2026
    status: finished
    difficulty: moderate
    engagement: okay
    learned: |
      A bit about Eva Perón.
    thoughts: |
      Miranda France's book mentioned Eva Perón a few times. So the next
      book I read was this biography. While this was reasonably educational,
      it felt quite academic as opposed to narrative. The author was trying
      hard to get to the actual truth. Every time she would mention a
      controversial opinion, she would examine it from all angles to make
      sure she wasn't claiming something wrong. I didn't really care so much
      about Eva Perón and could have skipped on some of those details. But I
      still did learn a bit about Eva Perón.

timerman:
  type: book
  title: Prisoner Without a Name, Cell Without a Number
  author: Timerman, Jacobo
  affiliated:
    - role: translator
      names: Talbot, Toby
  date: 1981
  topics: [Argentina, Dirty War, 20th century, torture, antisemitism, journalism]
  form: memoir
  read:
    when: 2026
    status: finished
    difficulty: easy
    engagement: okay
    learned: |
      Details of some of the torture that the dictatorship inflicted upon
      the people. That there were very few English-language newspapers in
      Buenos Aires, and the author's newspaper was one of them.
    thoughts: |
      This book was quite interesting in the first half. I had just learned
      about the dictatorship in the previous couple of books, and this book
      had started to go into the details of some of the torture that the
      dictatorship inflicted upon the people. So I was quite engrossed. But
      then in the second half the author made it into an anti-semitic issue
      and then went on a long tangent about anti-semitism. I got quite bored
      when that happened, because that wasn't the reason I was reading the
      book. In the end the book was quite short, so it was quick to finish
      after skimming over the second half.

durrell:
  type: book
  title: The Whispering Land
  author: Durrell, Gerald
  date: 1961
  topics: [Argentina, Patagonia, Jujuy, wildlife, natural history, estancias, 20th century]
  form: travel memoir
  read:
    when: 2026
    status: finished
    difficulty: easy
    engagement: good
    learned: |
      Some animals that are found there. I got enamoured by penguins and sea
      lions. I learned about estancias: apparently that was how people used
      to live back then in the pampas.
    thoughts: |
      I read this because I also got interested in understanding the flora
      and fauna of Argentina. The book was entertaining throughout because of
      the author's humour.

winter:
  type: book
  title: "Long After Midnight at the Niño Bien: A Yanqui's Missteps in Argentina"
  author: Winter, Brian
  date: 2008
  topics: [Argentina, Buenos Aires, tango, 2001 economic crisis, 21st century]
  form: travel memoir
  read:
    when: 2026
    status: finished
    difficulty: easy
    engagement: good
    learned: |
      A good amount. The tango culture became familiar to me, and I learned
      how the country deals with an economic crisis.
    thoughts: |
      I was sceptical about this book in the beginning. It just seemed like
      a horny guy trying to get laid in a new country. I wasn't really
      learning a lot about Argentina. But after about 1/3rd of the book it
      picked up and the tango culture started to become familiar to me.
      Later on an economic crisis happens and the author described how the
      country deals with it. It was engaging to read and I did end up
      learning a good amount.

gilliland:
  type: book
  title: A Flower Traveled in My Blood
  author: Gilliland, Haley Cohen
  date: 2025
  topics: [Argentina, Dirty War, Abuelas de Plaza de Mayo, stolen children, human rights, genetics, 20th century]
  form: narrative history
  read:
    when: 2026
    status: finished
    difficulty: moderate
    engagement: gripping
    learned: |
      So much, in detail, about the dictatorship.
    thoughts: |
      The most mind-blowing, the most amazing book in the sequence. What an
      amazing book. It was hard to put down. I learned so much in detail
      about the dictatorship. And all the characters were real. And the
      abuelas were portrayed so well. One could just feel what the people
      involved were feeling. The book did a good job at focusing on one
      family instead of trying to cover everyone's case. The pacing was
      perfect. The sequence in which to narrate the events was perfect. I
      have been gifting this book to friends.

bridges:
  type: book
  title: Uttermost Part of the Earth
  author: Bridges, E. Lucas
  date: 1948
  topics: [Argentina, Chile, Tierra del Fuego, Selk'nam, Yaghan, indigenous peoples, missionaries, settlers, 19th century, 20th century]
  form: memoir
  read:
    when: 2026-09
    status: finished
    difficulty: moderate
    engagement: okay
    learned: |
      A reasonable amount about the Yaghans and the Onas (Selk'nam): their
      own names for themselves, their sense of right and wrong, the many
      reasons the Ona accepted for killing someone, and their marriages.
    thoughts: |
      Fun intermittently, and I did learn a reasonable amount about the
      Yaghans and Onas, but overall it was way too long. It just felt like
      all the pages from the author's diary without any editing. There were
      some interesting chapters, but more than half the chapters were just
      about very boring activities. It didn't really need five whole parts.
      Each part was the same story: he goes to a new piece of land, tries to
      settle there, clears out space for farms and roads, creates fences to
      contain animals, goes out hunting for guanaco meat, and so on. After a
      while it became rather repetitive. It could have been cut down to half
      its size.

      Difficulty was kind of moderate. It did have a lot of characters, and
      because of the length it was difficult to remember who did what. Also
      the characters had hard-to-remember names, because they were from the
      tribes.
