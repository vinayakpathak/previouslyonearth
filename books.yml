# Every book read for this book, in the order read, with notes on each.
#
# All of them are listed at the back of the book under "Bookshelf", cited or
# not. Cite one in a chapter with its key: @bridges, or with a location,
# @bridges[p. 12]. Citations become footnotes.
#
# The book's details (type, title, author, translator, date) are in
# Hayagriva's format:
# https://github.com/typst/hayagriva/blob/main/docs/file-format.md
#
# Three more fields are for choosing what to read next. They never appear in
# the book.
#
#   topics       places (countries, then regions), periods (centuries or
#                named eras) and themes, e.g. [Germany, 19th century,
#                industrial revolution]. Reuse a topic already used here
#                before making a new one.
#   form         the kind of book: travel memoir, memoir, narrative
#                journalism, narrative history, biography, academic history
#                and so on
#   read:        what you made of the book
#     when         month you finished or stopped, e.g. 2026-10
#     status       finished, reading or abandoned
#     difficulty   too easy, easy, moderate, hard or too hard
#     engagement   gripping, good, okay or slog
#     learned      what it taught you that you didn't know
#     questions    what it left you curious about
#     thoughts     anything else
#
# Only status, difficulty and engagement are needed.

guerriero:
  type: book
  title: "A Simple Story: The Last Malambo"
  author: Guerriero, Leila
  affiliated:
    - role: translator
      names: Riddle, Frances
  date: 2017
  topics: [Argentina, Córdoba, malambo, folk dance, 21st century]
  form: narrative journalism
  read:
    when: 2026
    status: finished
    difficulty: easy
    engagement: gripping
    learned: |
      A cultural aspect of Argentina: malambo, the dance the book is about.
    thoughts: |
      I quite enjoyed the book. It was short and it followed a small number
      of real-life people. And it taught me about a cultural aspect of
      Argentina. It was great to set the setting. The people's lives were
      interesting. They were relatable even though they were about a
      specific dance. But there was passion. And there was drama. There was
      suspense about whether the main character was going to win or not.
      And the author did an excellent job at getting to know the people she
      wrote about. Overall an excellent reading experience.

france:
  type: book
  title: Bad Times in Buenos Aires
  author: France, Miranda
  date: 1998
  topics: [Argentina, Buenos Aires, Dirty War, 20th century]
  form: travel memoir
  read:
    when: 2026
    status: finished
    difficulty: moderate
    engagement: gripping
    learned: |
      Quite a bit of Argentina's history, alongside life in Buenos Aires.
    thoughts: |
      I really loved this book. In general I enjoy books written in the
      style of a travel memoir, but with history lessons interspersed. The
      author went to Buenos Aires and lived there for a while and explored
      the city and the life and wrote about it in the book. But it wasn't
      only her description of the travel. She would also teach about the
      history of Argentina every now and then. I got to learn quite a bit.
      It was a good deeper book after the first book's intro.

bridges:
  type: book
  title: Uttermost Part of the Earth
  author: Bridges, E. Lucas
  date: 1948
  topics: [Argentina, Chile, Tierra del Fuego, Selk'nam, Yaghan, indigenous peoples, missionaries, settlers, 19th century, 20th century]
  form: memoir
  read:
    when: 2026-09
    status: finished
    difficulty: moderate
    engagement: okay
    learned: |
      A reasonable amount about the Yaghans and the Onas (Selk'nam): their
      own names for themselves, their sense of right and wrong, the many
      reasons the Ona accepted for killing someone, and their marriages.
    thoughts: |
      Fun intermittently, and I did learn a reasonable amount about the
      Yaghans and Onas, but overall it was way too long. It just felt like
      all the pages from the author's diary without any editing. There were
      some interesting chapters, but more than half the chapters were just
      about very boring activities. It didn't really need five whole parts.
      Each part was the same story: he goes to a new piece of land, tries to
      settle there, clears out space for farms and roads, creates fences to
      contain animals, goes out hunting for guanaco meat, and so on. After a
      while it became rather repetitive. It could have been cut down to half
      its size.

      Difficulty was kind of moderate. It did have a lot of characters, and
      because of the length it was difficult to remember who did what. Also
      the characters had hard-to-remember names, because they were from the
      tribes.
